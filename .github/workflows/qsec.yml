name: QSec Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python tools/build_native_core.py --output build/qsec-law-core
      - run: python -m compileall -q qsec tests tools
      - run: python -m unittest discover -s tests -v
        env:
          QSEC_NATIVE_CORE: ${{ github.workspace }}/build/qsec-law-core
      - run: python tools/benchmark_qsec.py > benchmark-results.json
      - run: python tools/benchmark_trust_mesh.py > trust-mesh-results.json
      - run: python tools/benchmark_quantum_core.py --native build/qsec-law-core > quantum-core-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qsec-benchmarks-python-${{ matrix.python-version }}
          path: |
            benchmark-results.json
            trust-mesh-results.json
            quantum-core-results.json

  qsa-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install "qubit-state-algebra @ git+https://github.com/R-D-BioTech-Alaska/QSA.git@v0.2.0"
      - run: qsec quantum qsa-evidence examples/qsa50_ghz_request.json --timeout 120 > qsa-evidence.json
      - run: qsec quantum qsa-grover examples/qsa60_grover_request.json --timeout 120 > qsa-grover.json
      - run: qsec quantum qsa-symmetry examples/qsa60_symmetry_request.json --timeout 120 > qsa-symmetry.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qsa-0.2-evidence
          path: |
            qsa-evidence.json
            qsa-grover.json
            qsa-symmetry.json
