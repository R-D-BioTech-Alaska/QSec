[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsec"
version = "0.3.0"
description = "Physics-grounded security controls for quantum systems and post-quantum migration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "R&D BioTech Alaska"}
]
dependencies = [
  "numpy>=1.24"
]

[project.scripts]
qsec = "qsec.cli:main"

[tool.setuptools]
packages = ["qsec"]
